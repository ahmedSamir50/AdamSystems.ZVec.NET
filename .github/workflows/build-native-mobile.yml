name: Build Native (mobile)

on:
  pull_request:
    paths:
      - "src/Native/**"
      - "build/ci/**"
      - ".github/workflows/build-native-mobile.yml"
      - ".github/workflows/build-native-try-catalyst.yml"
  workflow_dispatch:
    inputs:
      try_catalyst_only:
        description: "If true, only build maccatalyst-arm64. Skips Android + other Apple targets."
        type: boolean
        default: false
  workflow_call:
    inputs:
      try_catalyst_only:
        description: "If true, only build maccatalyst-arm64."
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.set.outputs.android }}
      apple: ${{ steps.set.outputs.apple }}
      catalyst_only: ${{ steps.set.outputs.catalyst_only }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          TRY="${{ inputs.try_catalyst_only }}"
          if [ "$TRY" = "true" ]; then
            echo 'android=[]' >> "$GITHUB_OUTPUT"
            echo 'apple=["maccatalyst-arm64"]' >> "$GITHUB_OUTPUT"
            echo 'catalyst_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=[{"abi":"arm64-v8a","rid":"android-arm64"},{"abi":"x86_64","rid":"android-x64"}]' >> "$GITHUB_OUTPUT"
            echo 'apple=["ios-arm64","iossimulator-arm64","maccatalyst-arm64"]' >> "$GITHUB_OUTPUT"
            echo 'catalyst_only=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved try_catalyst_only=$TRY"

  android:
    name: android-${{ matrix.abi }}
    needs: matrix
    if: needs.matrix.outputs.android != '[]'
    runs-on: ubuntu-latest
    # First NDK/CMake green may need iteration; do not block desktop pack.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.android) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch zvec tags + version fallback patch
        run: |
          set -euo pipefail
          zvec="src/Native/ZVec.Native/external/zvec"
          git -C "$zvec" fetch --tags --force origin || true
          git -C "$zvec" fetch --deepen=200 origin || true
          patch="$GITHUB_WORKSPACE/build/ci/patches/zvec-version-fallback-0.5.1.patch"
          git -C "$zvec" apply --check "$patch"
          git -C "$zvec" apply "$patch"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build Android native
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build/ci/build-android.sh build/ci/deploy-native.sh
          ./build/ci/build-android.sh "${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvec-native-${{ matrix.rid }}
          path: src/Core/ZVec.NET/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error
          retention-days: 14

  apple-mobile:
    name: ${{ matrix.target }}
    needs: matrix
    runs-on: macos-latest
    # Soft-fail full matrix; hard-fail when validating Catalyst-only (CRC patch check).
    continue-on-error: ${{ needs.matrix.outputs.catalyst_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.apple) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch zvec tags + version fallback patch
        run: |
          set -euo pipefail
          zvec="src/Native/ZVec.Native/external/zvec"
          git -C "$zvec" fetch --tags --force origin || true
          git -C "$zvec" fetch --deepen=200 origin || true
          patch="$GITHUB_WORKSPACE/build/ci/patches/zvec-version-fallback-0.5.1.patch"
          git -C "$zvec" apply --check "$patch"
          git -C "$zvec" apply "$patch"

      - name: Install Ninja
        run: brew install ninja

      - name: Build Apple mobile native
        run: |
          chmod +x build/ci/build-ios.sh build/ci/deploy-native.sh
          ./build/ci/build-ios.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvec-native-${{ matrix.target }}
          path: src/Core/ZVec.NET/runtimes/${{ matrix.target }}/native/*
          if-no-files-found: error
          retention-days: 14
