name: Try optional native RIDs

# Manual-only validation for the remaining soft desktop RID (win-arm64).
# Avoids the full desktop matrix while iterating on MSVC ARM64 / ailego (#622).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/build-native.yml
    with:
      try_optional_only: true
